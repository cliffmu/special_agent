# Home Assistant Voice Preview Edition only. ESPHome 2026.8.2.
# Keep the existing device name, API encryption key and OTA password when adopting.
# Copy secrets.example.yaml to secrets.yaml and fill it in before compiling.
# Run python prepare.py once to download and verify the pinned hardware package.
# This builds a firmware image; nothing in this repository flashes the device.
# Keep the physical mute switch on during first setup, then unmute for the test.
#
# Hardware/audio configuration is reused from the pinned community firmware:
# https://github.com/TristanBrotherton/voicepe-realtime-firmware
# Its config/Python license is MIT; its C++ components are GPLv3. Sources and
# license remain available at the immutable revision used below.
substitutions:
  name: special-agent-voice-pe
  friendly_name: Special Agent Voice PE
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password
  ota_password: !secret ota_password
  api_key: !secret api_key
  # Full LAN URL, including the bridge token; never put the OpenAI key here.
  va_url: !secret special_agent_voice_url
  default_wake_word: Okay Nabu
  firmware_revision: cf73d8dcee605a774229554e946f1fc51e515b2e
  voice_pe_revision: 0579e7b9d8504264719c593474c85447253c9dc1
  # Pin assets too: a pinned package otherwise still contains mutable main/dev URLs.
  wake_word_model: github://TristanBrotherton/voicepe-realtime-firmware/models/hey_leonard.json@${firmware_revision}
  timer_finished_sound_file: https://raw.githubusercontent.com/TristanBrotherton/voicepe-realtime-firmware/${firmware_revision}/sounds/gentle_timer.flac
  jack_connected_sound_file: https://raw.githubusercontent.com/esphome/home-assistant-voice-pe/${voice_pe_revision}/sounds/jack_connected.flac
  jack_disconnected_sound_file: https://raw.githubusercontent.com/esphome/home-assistant-voice-pe/${voice_pe_revision}/sounds/jack_disconnected.flac
  mute_switch_on_sound_file: https://raw.githubusercontent.com/esphome/home-assistant-voice-pe/${voice_pe_revision}/sounds/mute_switch_on.flac
  mute_switch_off_sound_file: https://raw.githubusercontent.com/esphome/home-assistant-voice-pe/${voice_pe_revision}/sounds/mute_switch_off.flac
  wake_word_triggered_sound_file: https://raw.githubusercontent.com/esphome/home-assistant-voice-pe/${voice_pe_revision}/sounds/wake_word_triggered.flac
  center_button_press_sound_file: https://raw.githubusercontent.com/esphome/home-assistant-voice-pe/${voice_pe_revision}/sounds/center_button_press.flac
  center_button_double_press_sound_file: https://raw.githubusercontent.com/esphome/home-assistant-voice-pe/${voice_pe_revision}/sounds/center_button_double_press.flac
  center_button_triple_press_sound_file: https://raw.githubusercontent.com/esphome/home-assistant-voice-pe/${voice_pe_revision}/sounds/center_button_triple_press.flac
  center_button_long_press_sound_file: https://raw.githubusercontent.com/esphome/home-assistant-voice-pe/${voice_pe_revision}/sounds/center_button_long_press.flac
  factory_reset_initiated_sound_file: https://raw.githubusercontent.com/esphome/home-assistant-voice-pe/${voice_pe_revision}/sounds/factory_reset_initiated.mp3
  factory_reset_cancelled_sound_file: https://raw.githubusercontent.com/esphome/home-assistant-voice-pe/${voice_pe_revision}/sounds/factory_reset_cancelled.mp3
  factory_reset_confirmed_sound_file: https://raw.githubusercontent.com/esphome/home-assistant-voice-pe/${voice_pe_revision}/sounds/factory_reset_confirmed.mp3
  easter_egg_tick_sound_file: https://raw.githubusercontent.com/esphome/home-assistant-voice-pe/${voice_pe_revision}/sounds/easter_egg_tick.mp3
  easter_egg_tada_sound_file: https://raw.githubusercontent.com/esphome/home-assistant-voice-pe/${voice_pe_revision}/sounds/easter_egg_tada.mp3
  error_cloud_expired_sound_file: https://raw.githubusercontent.com/esphome/home-assistant-voice-pe/${voice_pe_revision}/sounds/error_cloud_expired.mp3

packages:
  voice_hardware: !include .generated/voice-hardware.yaml

esphome:
  min_version: 2026.8.2
  project:
    name: cliffmu.special-agent-live
    version: "0.1.0"

# Keep the encrypted native API for existing HA controls and wake-word startup.
api:
  reboot_timeout: 0s

# The upstream component logs its complete connection URL at INFO. The URL
# contains our shared bridge token, so leave logging at WARN or lower verbosity.
logger:
  level: WARN

va_client:
  # Experimental simultaneous listening/playback. XMOS echo cancellation can leak
  # speaker audio; test with low volume first. This setting alone cannot guarantee
  # clean barge-in. The bridge keeps one continuous listening phase until close.
  barge_in: true

micro_wake_word:
  vad:
    model: github://esphome/micro-wake-word-models/models/v2/vad.json@05b65922cc433c9df13e98e32a7fe520758c837e

# Preserve the physical mute guard, and also end the Live session if software mute
# changes while a future firmware/UI phase happens to be replying or thinking.
switch:
  - id: !extend master_mute_switch
    on_turn_on:
      - lambda: id(va)->send_interrupt();
