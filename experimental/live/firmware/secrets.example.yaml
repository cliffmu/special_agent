# Example values only. Copy to secrets.yaml and use your existing device keys.
wifi_ssid: YOUR_WIFI_NAME
wifi_password: YOUR_WIFI_PASSWORD
ota_password: YOUR_EXISTING_OTA_PASSWORD
# The existing ESPHome API encryption key (32 random bytes, Base64 encoded).
api_key: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
# Generate a URL-safe token on the bridge, set VOICE_DEVICE_TOKEN to the same
# value, and use the bridge machine's LAN address. The token is sent over LAN WS.
# Keep secrets.yaml private; this URL never needs your OpenAI or HA access token.
special_agent_voice_url: ws://192.168.1.10:8099/voice?token=REPLACE_WITH_BRIDGE_TOKEN
