name: Special Agent Live
version: "0.1.5"
slug: special_agent_live
description: GPT-Live audio bridge for a Home Assistant Voice Preview Edition
url: https://github.com/cliffmu/special_agent/tree/codex/gpt-live-test
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: true
# Allow the bridge to close Live and finish an already accepted HA request.
timeout: 150
stage: experimental
homeassistant_api: true
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Voice PE WebSocket audio and health endpoint
watchdog: http://[HOST]:[PORT:8099]/health
options:
  api_key: null
  device_token: null
  room: ""
  backend: demo
  agent_id: conversation.special_agent
  agent_model: gpt-5.6-terra
  reasoning_effort: low
  fast_mode: false
  idle_timeout: 30
  max_duration: 0
schema:
  api_key: password
  device_token: password
  room: str(0,120)
  backend: list(demo|home-assistant)
  agent_id: str(1,255)
  agent_model: list(gpt-5.6-terra|gpt-5.6-luna|gpt-5.6-sol|gpt-6-astra|gpt-5|gpt-5-mini|gpt-5-nano)
  reasoning_effort: list(none|minimal|low|medium|high|xhigh|max)
  fast_mode: bool
  idle_timeout: int(10,600)
  max_duration: int(0,1800)
