configuration:
  api_key:
    name: OpenAI API key
    description: An OpenAI API key with GPT-Live access. Demo mode also uses paid Live audio.
  device_token:
    name: Voice device token
    description: A random 32–256 character URL-safe token matching the token in your Voice PE WebSocket URL. Use letters, digits, underscores and hyphens only.
  room:
    name: Room
    description: Room containing this Voice PE, used to interpret requests such as "turn on the lights here".
  backend:
    name: Backend
    description: Start with demo for an audio test. Select home-assistant to delegate requests to your configured Special Agent.
  agent_id:
    name: Conversation agent entity
    description: Your available conversation agent entity ID, for example conversation.special_agent_2. Used by the home-assistant backend.
  idle_timeout:
    name: Keep listening after activity (seconds)
    description: Stay awake while speaking or working, then wait this long after the latest speech or completed task. New speech restarts the countdown. Default 30; range 10–600 seconds. Save and restart to apply.
  max_duration:
    name: Optional session length limit (seconds)
    description: Set to 0 to let conversations continue until the idle countdown expires (default). A positive value, up to 1800, ends the session that many seconds after it started, even during activity.
network:
  8099/tcp: Voice PE WebSocket audio and the /health endpoint. Use this host port in the firmware URL.
