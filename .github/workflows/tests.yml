name: Run tests

on:
  pull_request:
    paths:
      - '**.py'
      - 'tests/**'

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest voluptuous numpy aiohttp
    - name: Run tests
      run: |
        pytest -q
